<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="google" content="notranslate" />
<title>分类统计预览 · 清醒时光</title>
<style>
  :root {
    --bg: #0e1014;
    --card: #171b22;
    --card-2: #1e242d;
    --text: #eef1f6;
    --muted: #8b94a5;
    --accent: #4c8dff;
    --accent-2: #7bd0ff;
    --line: #262d38;
    --warn: #ffb02e;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; overflow-x: hidden; }
  body {
    background: radial-gradient(1200px 800px at 70% -10%, #101827 0%, #07090c 55%);
    color: var(--text);
    font-family: -apple-system, 'MiSans', 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .mono { font-variant-numeric: tabular-nums; }
  .stage { min-height: 100dvh; display: flex; align-items: center; justify-content: center; gap: 34px; padding: 20px; }
  .app-shell {
    position: relative;
    display: flex;
    flex-direction: column;
    width: min(390px, 100vw);
    height: min(844px, calc(100dvh - 40px));
    background: var(--bg);
    border: 1px solid #242b36;
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 30px 90px rgba(0, 0, 0, 0.55);
    flex: none;
  }
  .app-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: calc(16px + env(safe-area-inset-top)) 18px 10px; flex: none; }
  .app-header h1 { font-size: 23px; margin: 0; letter-spacing: 0.4px; }
  .app-header .subtitle { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
  .preview-badge { flex: none; font-size: 10.5px; color: var(--accent-2); border: 1px solid rgba(123, 208, 255, 0.28); background: rgba(76, 141, 255, 0.08); border-radius: 999px; padding: 4px 9px; margin-top: 3px; letter-spacing: 0.02em; }
  .segmented { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin: 0 14px 8px; padding: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 13px; flex: none; }
  .segmented button { border: 0; background: transparent; color: var(--muted); font-size: 12.5px; padding: 8px 6px; border-radius: 9px; min-height: 38px; }
  .segmented button[aria-selected='true'] { color: var(--text); background: linear-gradient(180deg, #24344d, #1d2838); box-shadow: inset 0 0 0 1px rgba(123, 208, 255, 0.18); }
  .panel-wrap { flex: 1; min-height: 0; overflow: hidden; position: relative; }
  .panel { height: 100%; overflow-y: auto; overflow-x: hidden; padding: 4px 14px calc(88px + env(safe-area-inset-bottom)); scrollbar-width: none; }
  .panel::-webkit-scrollbar { display: none; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; margin-bottom: 12px; }
  .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .card-title { font-size: 13.5px; font-weight: 600; }
  .small { font-size: 11px; color: var(--muted); }
  .tiny { font-size: 10.5px; line-height: 1.65; color: var(--muted); }

  .mode-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .mode-tabs { display: inline-flex; padding: 3px; border: 1px solid var(--line); background: var(--card); border-radius: 11px; gap: 2px; }
  .mode-tabs button { border: 0; background: transparent; color: var(--muted); font-size: 12px; min-height: 32px; padding: 4px 13px; border-radius: 8px; }
  .mode-tabs button[aria-selected='true'] { background: #26354c; color: var(--accent-2); }
  .period-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .period-nav { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .arrow-btn { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); display: grid; place-items: center; font-size: 18px; line-height: 1; flex: none; }
  .arrow-btn:disabled { opacity: 0.3; cursor: default; }
  .period-label { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cat-settings-btn { border: 1px solid var(--line); background: var(--card); color: var(--accent-2); border-radius: 999px; min-height: 34px; padding: 5px 10px; font-size: 11px; flex: none; }

  .hero { background: linear-gradient(155deg, #162232 0%, #171b22 62%); border: 1px solid var(--line); border-radius: 18px; padding: 15px 16px 14px; margin-bottom: 12px; }
  .hero-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .hero-kicker { font-size: 11px; color: var(--muted); }
  .hero-number { font-size: 37px; font-weight: 650; line-height: 1.05; margin-top: 4px; letter-spacing: -0.5px; }
  .hero-side { text-align: right; font-size: 11px; color: var(--muted); line-height: 1.8; padding-bottom: 3px; }
  .hero-side b { color: var(--text); font-size: 12.5px; font-weight: 600; margin-left: 4px; }
  .hero-note { margin: 10px 0 0; font-size: 10.5px; color: var(--muted); }
  .hero-empty { padding: 20px 0 10px; text-align: center; color: var(--muted); font-size: 12px; }

  .donut-wrap { display: flex; justify-content: center; padding: 4px 0 2px; }
  .donut-center { font-size: 15px; font-weight: 650; fill: var(--text); }
  .donut-center-sub { font-size: 8.5px; fill: var(--muted); }
  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; margin-top: 8px; }
  .legend-chip { display: flex; align-items: center; gap: 6px; min-width: 0; border: 1px solid transparent; background: transparent; border-radius: 8px; padding: 5px 4px; text-align: left; }
  .legend-chip i { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .legend-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; color: var(--muted); }
  .legend-chip b { margin-left: auto; font-size: 10.5px; color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; flex: none; }
  .legend-chip[aria-pressed='true'] { border-color: rgba(123, 208, 255, 0.4); background: rgba(76, 141, 255, 0.1); }
  .legend-chip.archived span { opacity: 0.55; }
  .legend-empty { text-align: center; color: var(--muted); font-size: 11.5px; padding: 12px 0 4px; }

  .cat-line-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 1px 0 8px; margin: 0 -2px; }
  .cat-line-chips::-webkit-scrollbar { display: none; }
  .cat-line-chip { flex: none; border: 1px solid var(--line); background: var(--card-2); color: var(--muted); border-radius: 999px; padding: 5px 9px; font-size: 10.5px; display: inline-flex; align-items: center; gap: 5px; }
  .cat-line-chip i { width: 6px; height: 6px; border-radius: 50%; }
  .cat-line-chip[aria-pressed='true'] { border-color: var(--accent); color: var(--text); background: rgba(76, 141, 255, 0.13); }
  .chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
  #trend-chart rect.active-bucket { fill: rgba(238, 241, 246, 0.07); stroke: rgba(238, 241, 246, 0.16); stroke-width: 0.8; }
  .bucket-detail { margin-top: 7px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 5px 8px; min-height: 18px; }
  .bucket-detail b { font-size: 11.5px; color: var(--text); }
  .bucket-detail span { font-size: 10.5px; color: var(--muted); }
  .bucket-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 9.5px; color: var(--muted); }
  .bucket-chip i { width: 5px; height: 5px; border-radius: 50%; }
  .chart-note { margin-top: 6px; font-size: 10.5px; color: var(--muted); line-height: 1.6; }

  .cat-total-list { display: flex; flex-direction: column; }
  .cat-total-row { padding: 9px 0; border-top: 1px solid var(--line); }
  .cat-total-row:first-child { border-top: 0; }
  .cat-total-top { display: flex; align-items: baseline; gap: 7px; }
  .cat-total-top i { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .cat-total-name { font-size: 12px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cat-total-name em { font-style: normal; color: var(--muted); font-size: 10px; margin-left: 3px; }
  .cat-total-value { margin-left: auto; font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cat-total-sub { display: flex; align-items: center; gap: 8px; margin: 5px 0 0 14px; font-size: 10px; color: var(--muted); }
  .cat-share { flex: 1; height: 3px; border-radius: 999px; background: #242b36; overflow: hidden; }
  .cat-share span { display: block; height: 100%; border-radius: inherit; }
  .cat-total-pct { width: 30px; text-align: right; font-variant-numeric: tabular-nums; }
  .cat-total-delta { width: 58px; text-align: right; white-space: nowrap; }
  .cat-total-delta.up { color: #7fe3ba; }
  .cat-total-delta.down { color: #ffab97; }
  .cat-total-total { display: flex; justify-content: space-between; gap: 10px; padding: 11px 0 2px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); }
  .cat-total-total b { color: var(--text); font-variant-numeric: tabular-nums; }
  .empty-card { text-align: center; padding: 26px 12px; color: var(--muted); font-size: 12px; }

  .placeholder-card { padding: 34px 18px; text-align: center; }
  .placeholder-card .hero-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }

  .tabbar { position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: rgba(14, 16, 20, 0.94); border-top: 1px solid var(--line); backdrop-filter: blur(14px); }
  .tab { border: 0; background: transparent; color: var(--muted); font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 3px 0 0; min-height: 44px; }
  .tab .ico { font-size: 16px; line-height: 1; }
  .tab.active { color: var(--accent-2); }

  .sheet-mask { position: absolute; inset: 0; background: rgba(4, 6, 9, 0.62); display: none; align-items: flex-end; z-index: 20; }
  .sheet-mask.open { display: flex; }
  .sheet { width: 100%; max-height: 78%; overflow-y: auto; background: var(--card); border-top: 1px solid var(--line); border-radius: 22px 22px 0 0; padding: 16px 16px calc(18px + env(safe-area-inset-bottom)); }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .sheet-title { font-size: 15px; font-weight: 600; }
  .icon-btn { border: 1px solid var(--line); background: var(--card-2); color: var(--text); border-radius: 10px; width: 36px; height: 36px; display: grid; place-items: center; font-size: 16px; }
  .editor-note { margin: 0 0 10px; font-size: 10.5px; line-height: 1.6; color: var(--muted); }
  .editor-list { display: flex; flex-direction: column; gap: 6px; }
  .editor-row { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--line); padding-top: 7px; }
  .editor-row:first-child { border-top: 0; padding-top: 0; }
  .editor-row > i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .editor-input { flex: 1; min-width: 0; background: var(--card-2); border: 1px solid var(--line); border-radius: 9px; padding: 7px 8px; font-size: 12px; color: var(--text); }
  .editor-input:focus { outline: 1px solid var(--accent); }
  .editor-row.archived { opacity: 0.55; }
  .archive-btn { flex: none; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 8px; padding: 5px 7px; font-size: 10px; }
  .add-row { display: flex; gap: 8px; margin-top: 12px; padding-top: 11px; border-top: 1px solid var(--line); }
  .add-row .editor-input { flex: 1; }
  .add-btn { flex: none; border: 1px solid rgba(123, 208, 255, 0.35); background: rgba(76, 141, 255, 0.12); color: var(--accent-2); border-radius: 9px; padding: 6px 11px; font-size: 11px; }

  .preview-note { width: 230px; color: var(--muted); font-size: 12px; line-height: 1.75; flex: none; }
  .preview-note b { color: var(--text); display: block; font-size: 13px; margin-bottom: 6px; }
  .preview-note .tip { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  .preview-note kbd { font-family: inherit; color: var(--accent-2); }
  button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
  @media (max-width: 900px) { .preview-note { display: none; } }
  @media (max-width: 640px) { .stage { padding: 0; display: block; } .app-shell { width: 100%; height: 100dvh; border: 0; border-radius: 0; box-shadow: none; } }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="stage">
  <aside class="preview-note" aria-hidden="true">
    <b>分类统计预览</b>
    这个文件是可交互的静态预览，使用演示数据，不会读写 App 的真实记录。
    <div class="tip">
      <kbd>周 / 月 / 年</kbd>：切换统计周期<br />
      <kbd>点分类</kbd>：切换折线并高亮<br />
      <kbd>分类设置</kbd>：改名后图表立即同步
    </div>
    <div class="tip">
      只统计清醒分类，补觉不计入；占比按本周期分类合计计算。
    </div>
  </aside>

  <div class="app-shell" id="app">
    <header class="app-header">
      <div>
        <h1>清醒时光</h1>
        <p class="subtitle">11月13日 星期五 · 设计预览 · 演示数据</p>
      </div>
      <span class="preview-badge">预览版</span>
    </header>

    <div class="segmented" role="tablist" aria-label="历史视图切换">
      <button id="tab-week" data-tab="week" role="tab" aria-selected="false" aria-controls="panel-main" tabindex="-1">周趋势</button>
      <button id="tab-days" data-tab="days" role="tab" aria-selected="false" aria-controls="panel-main" tabindex="-1">每日明细</button>
      <button id="tab-stats" data-tab="stats" role="tab" aria-selected="true" aria-controls="panel-main" tabindex="0">分类统计</button>
    </div>

    <div class="panel-wrap">
      <section class="panel" id="panel-main" role="tabpanel" aria-labelledby="tab-stats"></section>
    </div>

    <nav class="tabbar" aria-label="主导航">
      <button class="tab"><span class="ico">◷</span>今日</button>
      <button class="tab active" aria-current="page"><span class="ico">▤</span>历史</button>
      <button class="tab"><span class="ico">⇪</span>导出</button>
      <button class="tab"><span class="ico">⚙</span>设置</button>
    </nav>

    <div class="sheet-mask" id="editor-sheet" role="dialog" aria-modal="true" aria-label="分类设置">
      <div class="sheet">
        <div class="sheet-head">
          <div class="sheet-title">分类设置（演示）</div>
          <button class="icon-btn" id="editor-close" aria-label="关闭">×</button>
        </div>
        <p class="editor-note">新增分类会在第一次记录后出现在图表；改名后图例、折线、柱状图和总时间会立即同步；停用会保留历史时间并标记「已停用」。实际版本在设置页管理分类。</p>
        <div class="editor-list" id="editor-list"></div>
        <div class="add-row">
          <input class="editor-input" id="new-cat-name" maxlength="12" placeholder="新分类名称" aria-label="新分类名称" />
          <button class="add-btn" id="add-cat">添加</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  const DEMO_NOW = new Date(2026, 10, 13); // 演示的“今天”，周五
  const DATA_START = new Date(2026, 0, 1);
  const DAY = 86_400_000;
  const pad = (n) => String(n).padStart(2, '0');
  const dateKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const mondayOf = (d) => {
    const x = new Date(d); x.setHours(0, 0, 0, 0);
    x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
    return x;
  };
  const monthStart = (d) => new Date(d.getFullYear(), d.getMonth(), 1);
  const monthEnd = (d) => new Date(d.getFullYear(), d.getMonth() + 1, 0);
  const daysInclusive = (a, b) => Math.round((new Date(b.getFullYear(), b.getMonth(), b.getDate()) - new Date(a.getFullYear(), a.getMonth(), a.getDate())) / DAY) + 1;
  const md = (d) => `${d.getMonth() + 1}/${d.getDate()}`;
  const hash = (text) => {
    let h = 2166136261;
    for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 16777619); }
    return (h >>> 0) / 4294967296;
  };
  const fmt = (minutes) => {
    const t = Math.max(0, Math.round(minutes));
    const h = Math.floor(t / 60), m = t % 60;
    return m ? `${h}h${pad(m)}m` : `${h}h`;
  };
  const fmtShort = (minutes) => {
    const t = Math.max(0, Math.round(minutes));
    const h = Math.floor(t / 60), m = t % 60;
    if (!h) return `${m}m`;
    return m ? `${h}h${pad(m)}` : `${h}h`;
  };
  function percentMap(entries, total) {    if (!total) return new Map();
    const rows = entries.map((e) => {
      const exact = e.minutes / total * 100;
      const pct = Math.floor(exact);
      return { id: e.cat.id, pct, rem: exact - pct };
    });
    let left = 100 - rows.reduce((sum, r) => sum + r.pct, 0);
    [...rows].sort((a, b) => b.rem - a.rem).forEach((r, i) => {
      if (i < left) r.pct += 1;
    });
    return new Map(rows.map((r) => [r.id, r.pct]));
  }

  const COLORS = {
    work: '#4c8dff',
    daily: '#3ddc97',
    'cat-discuss': '#c792ea',
    'cat-mech': '#ff9f43',
    'cat-ai': '#55c7e8',
    'cat-lang': '#f472b6',
    'cat-think': '#a3e635',
    unclassified: '#8b94a5',
  };
  const EXTRA = ['#ffb02e', '#7bd0ff', '#c792ea', '#ff8066', '#a3e635', '#f472b6', '#55c7e8', '#ff9f43'];

  let catalog = [
    { id: 'work', name: '工作', archived: false },
    { id: 'daily', name: '日常', archived: false },
    { id: 'cat-discuss', name: '讨论', archived: false },
    { id: 'cat-mech', name: '机械', archived: false },
    { id: 'cat-ai', name: 'Ai', archived: false },
    { id: 'cat-lang', name: '第二语言', archived: false },
    { id: 'cat-think', name: '思考', archived: false },
    { id: 'unclassified', name: '未分类', archived: false },
  ];
  const colorOf = (cat) => COLORS[cat.id] ?? EXTRA[Math.floor(hash(cat.id) * EXTRA.length)];
  const catById = (id) => catalog.find((c) => c.id === id);
  const catName = (id) => catById(id)?.name ?? id;

  /* ---------- 演示数据：每天只生成“分类分钟”，不包含补觉 ---------- */
  const days = new Map();
  const baseWeights = { work: 270, daily: 210, 'cat-discuss': 42, 'cat-mech': 34, 'cat-ai': 46, 'cat-lang': 26, 'cat-think': 38, unclassified: 88 };
  for (let d = new Date(DATA_START); d <= DEMO_NOW; d = addDays(d, 1)) {
    const key = dateKey(d);
    if (hash(`skip-${key}`) > 0.93) continue;
    const wd = d.getDay();
    const weekend = wd === 0 || wd === 6;
    const sleepMin = 7.2 * 60 + (hash(`sleep-${key}`) - 0.5) * 100;
    const awake = Math.round(1440 - sleepMin);
    const weights = {};
    for (const [id, base] of Object.entries(baseWeights)) {
      let w = base * (0.55 + hash(`w-${key}-${id}`) * 0.9);
      if (id === 'work') w *= weekend ? 0.35 : 1;
      if (id === 'daily') w *= weekend ? 1.25 : 1;
      if (id === 'cat-discuss') w *= weekend ? 0.6 : 1;
      if (id === 'cat-think' && weekend) w *= 1.25;
      if (id.startsWith('cat-') && hash(`z-${key}-${id}`) > 0.78) w = 0;
      weights[id] = w;
    }
    const sum = Object.values(weights).reduce((a, b) => a + b, 0);
    const cats = {};
    let used = 0;
    for (const [id, w] of Object.entries(weights)) {
      const value = sum > 0 ? Math.round((w / sum) * awake / 5) * 5 : 0;
      cats[id] = value;
      used += value;
    }
    cats.unclassified = Math.max(0, (cats.unclassified || 0) + (awake - used));
    days.set(key, { date: new Date(d), key, cats });
  }

  const state = {
    tab: 'stats',
    mode: 'week',
    anchor: new Date(DEMO_NOW),
    selectedCat: 'total',
    selectedBucket: null,
    editing: false,
  };

  const panel = document.getElementById('panel-main');

  /* ---------- 周期 ---------- */
  function sumCats(a, b) {
    const out = {};
    for (const [id, v] of Object.entries(a || {})) out[id] = (out[id] || 0) + (v || 0);
    for (const [id, v] of Object.entries(b || {})) out[id] = (out[id] || 0) + (v || 0);
    return out;
  }
  function daysBetween(start, end) {
    let total = 0;
    for (let d = new Date(start); d <= end; d = addDays(d, 1)) {
      const day = days.get(dateKey(d));
      if (day) total += 1;
    }
    return total;
  }
  function totalsOfRange(start, end) {
    let cats = {};
    for (let d = new Date(start); d <= end; d = addDays(d, 1)) {
      const day = days.get(dateKey(d));
      if (day) cats = sumCats(cats, day.cats);
    }
    return cats;
  }
  function periodFor(mode, anchor) {
    if (mode === 'week') {
      const start = mondayOf(anchor);
      const end = addDays(start, 6);
      const buckets = Array.from({ length: 7 }, (_, i) => {
        const date = addDays(start, i);
        return { date, label: md(date), cats: days.get(dateKey(date))?.cats ?? null };
      });
      const partial = end >= DEMO_NOW;
      const span = partial ? Math.min(7, daysInclusive(start, DEMO_NOW)) : 7;
      const prevStart = addDays(start, -7);
      return {
        mode, start, end, buckets,
        label: `${md(start)} – ${md(end)}`,
        kicker: '本周',
        recordedDays: daysBetween(start, end),
        totals: totalsOfRange(start, end),
        previous: totalsOfRange(prevStart, addDays(prevStart, span - 1)),
        prevLabel: partial ? '上周同期' : '上周',
      };
    }
    if (mode === 'month') {
      const start = monthStart(anchor), end = monthEnd(anchor);
      const n = end.getDate();
      const buckets = Array.from({ length: n }, (_, i) => {
        const date = new Date(start.getFullYear(), start.getMonth(), i + 1);
        return { date, label: String(i + 1), cats: days.get(dateKey(date))?.cats ?? null };
      });
      const prevStart = new Date(start.getFullYear(), start.getMonth() - 1, 1);
      const prevEnd = new Date(start.getFullYear(), start.getMonth(), 0);
      const partial = end >= DEMO_NOW;
      const span = partial ? Math.min(n, DEMO_NOW.getDate()) : n;
      return {
        mode, start, end, buckets,
        label: `${start.getFullYear()}年${start.getMonth() + 1}月`,
        kicker: '本月',
        recordedDays: daysBetween(start, end),
        totals: totalsOfRange(start, end),
        previous: totalsOfRange(prevStart, new Date(prevStart.getFullYear(), prevStart.getMonth(), Math.min(span, prevEnd.getDate()))),
        prevLabel: partial ? '上月同期' : '上月',
      };
    }
    const start = new Date(anchor.getFullYear(), 0, 1);
    const end = new Date(anchor.getFullYear(), 11, 31);
    const buckets = Array.from({ length: 12 }, (_, i) => {
      const ms = new Date(anchor.getFullYear(), i, 1);
      const me = new Date(anchor.getFullYear(), i + 1, 0);
      const cats = totalsOfRange(ms, me);
      return { date: ms, label: `${i + 1}月`, cats: Object.keys(cats).length ? cats : null };
    });
    const partial = end >= DEMO_NOW;
    const prevStart = new Date(start.getFullYear() - 1, 0, 1);
    const span = partial ? daysInclusive(start, DEMO_NOW) : daysInclusive(start, end);
    return {
      mode, start, end, buckets,
      label: `${start.getFullYear()}年`,
      kicker: '本年',
      recordedDays: daysBetween(start, end),
      totals: totalsOfRange(start, end),
      previous: totalsOfRange(prevStart, addDays(prevStart, span - 1)),
      prevLabel: partial ? '上年同期' : '上年',
    };
  }
  function shiftAnchor(dir) {
    const p = periodFor(state.mode, state.anchor);
    const d = state.mode === 'week'
      ? addDays(p.start, dir * 7)
      : state.mode === 'month'
        ? new Date(p.start.getFullYear(), p.start.getMonth() + dir, 1)
        : new Date(p.start.getFullYear() + dir, 0, 1);
    state.anchor = d;
    state.selectedBucket = null;
    renderStats();
  }
  function canNext(period) {
    const d = period.mode === 'week'
      ? addDays(period.start, 7)
      : period.mode === 'month'
        ? new Date(period.start.getFullYear(), period.start.getMonth() + 1, 1)
        : new Date(period.start.getFullYear() + 1, 0, 1);
    return d <= DEMO_NOW;
  }
  function canPrev(period) {
    const start = period.mode === 'week'
      ? addDays(period.start, -7)
      : period.mode === 'month'
        ? new Date(period.start.getFullYear(), period.start.getMonth() - 1, 1)
        : new Date(period.start.getFullYear() - 1, 0, 1);
    const end = period.mode === 'week'
      ? addDays(start, 6)
      : period.mode === 'month'
        ? new Date(start.getFullYear(), start.getMonth() + 1, 0)
        : new Date(start.getFullYear(), 11, 31);
    return start <= DEMO_NOW && end >= DATA_START;
  }

  /* ---------- 渲染：主面板 ---------- */
  function renderStats() {
    if (state.tab !== 'stats') {
      panel.innerHTML = `<div class="card placeholder-card">
        <div class="hero-title">${state.tab === 'week' ? '周趋势' : '每日明细'}</div>
        <p class="tiny" style="margin:0">这里沿用 v0.6.0 的正式实现；本预览聚焦「分类统计」。</p>
      </div>`;
      return;
    }
    const period = periodFor(state.mode, state.anchor);
    const entries = catalog
      .map((c) => ({ cat: c, minutes: period.totals[c.id] || 0, prev: period.previous[c.id] || 0 }))
      .filter((e) => e.minutes > 0)
      .sort((a, b) => b.minutes - a.minutes);
    const total = entries.reduce((sum, e) => sum + e.minutes, 0);
    const pcts = percentMap(entries, total);
    const top = entries[0];
    const avg = period.recordedDays ? total / period.recordedDays : 0;
    const prevTotal = Object.values(period.previous).reduce((sum, v) => sum + (v || 0), 0);
    const deltaPct = prevTotal > 0 ? Math.round((total - prevTotal) / prevTotal * 100) : null;
    const activeCat = state.selectedCat === 'total' ? null : catById(state.selectedCat);
    const activeId = activeCat ? activeCat.id : 'total';
    const ongoing = period.end >= DEMO_NOW && period.start <= DEMO_NOW;

    if (!entries.length) {
      panel.innerHTML = `
        ${renderModeRow()}
        <div class="card hero"><div class="hero-kicker">${period.kicker}分类合计</div><div class="hero-number mono">—</div><div class="hero-empty">这个周期还没有分类记录</div></div>
        <div class="card empty-card">换一个周 / 月 / 年，或先在「今日」记一次。</div>`;
      return;
    }

    if (state.selectedBucket === null || state.selectedBucket < 0 || state.selectedBucket >= period.buckets.length || !period.buckets[state.selectedBucket]?.cats) {
      const last = period.buckets.map((b, i) => b.cats ? i : -1).filter((i) => i >= 0).pop();
      state.selectedBucket = last ?? null;
    }

    panel.innerHTML = `
      ${renderModeRow()}
      <section class="hero" aria-label="分类统计概览">
        <div class="hero-top">
          <div>
            <div class="hero-kicker">${period.kicker}分类合计 · ${period.recordedDays} 天记录</div>
            <div class="hero-number mono">${fmt(total)}</div>
          </div>
          <div class="hero-side mono">
            日均<b>${fmt(avg)}</b><br />
            较${period.prevLabel}<b>${deltaPct === null ? '—' : deltaPct === 0 ? '持平' : `${deltaPct > 0 ? '+' : ''}${deltaPct}%`}</b>
          </div>
        </div>
        <p class="hero-note">仅统计清醒分类，补觉不计入。</p>
      </section>

      <section class="card">
        <div class="card-head"><span class="card-title">分类占比</span><span class="small">${period.label}</span></div>
        <div class="donut-wrap">${donutSvg(entries, total)}</div>
        <div class="legend">${entries.map((e) => `
          <button class="legend-chip ${e.cat.archived ? 'archived' : ''}" data-pick="${e.cat.id}" aria-pressed="${activeId === e.cat.id}">
            <i style="background:${colorOf(e.cat)}"></i><span>${escapeAttr(e.cat.name)}${e.cat.archived ? '（已停用）' : ''}</span><b>${pcts.get(e.cat.id)}%</b>
          </button>`).join('')}
        </div>
      </section>

      <section class="card">
        <div class="card-head"><span class="card-title">时间趋势</span><span class="small">柱状分类 · 折线${activeCat ? `「${escapeAttr(activeCat.name)}」` : '合计'}</span></div>
        <div class="cat-line-chips" role="group" aria-label="选择折线分类">
          <button class="cat-line-chip" data-pick="total" aria-pressed="${activeId === 'total'}"><i style="background:#eef1f6"></i>合计</button>
          ${entries.map((e) => `<button class="cat-line-chip" data-pick="${e.cat.id}" aria-pressed="${activeId === e.cat.id}"><i style="background:${colorOf(e.cat)}"></i>${escapeAttr(e.cat.name)}</button>`).join('')}
        </div>
        <div class="chart-wrap" id="trend-chart">${trendSvg(period, entries, activeCat)}</div>
        <div class="bucket-detail" id="bucket-detail">${bucketDetail(period, activeCat)}</div>
        <p class="chart-note">点柱状图的某一天/月，查看当时的分类构成；点上方分类名切换折线。${ongoing ? '当前周期尚未结束，按最新记录统计。' : ''}</p>
      </section>

      <section class="card">
        <div class="card-head"><span class="card-title">每个分类的总时间</span><span class="small">${period.label}</span></div>
        <div class="cat-total-list">
          ${entries.map((e) => {
            const pct = pcts.get(e.cat.id);
            const diff = e.prev > 0 ? e.minutes - e.prev : null;
            const deltaText = diff === null ? '—' : diff === 0 ? '持平' : `${diff > 0 ? '↑' : '↓'} ${fmtShort(Math.abs(diff))}`;
            return `<div class="cat-total-row">
              <div class="cat-total-top"><i style="background:${colorOf(e.cat)}"></i><span class="cat-total-name">${escapeAttr(e.cat.name)}${e.cat.archived ? '<em>已停用</em>' : ''}</span><span class="cat-total-value">${fmt(e.minutes)}</span></div>
              <div class="cat-total-sub">
                <span class="cat-share"><span style="width:${pct}%;background:${colorOf(e.cat)}"></span></span>
                <span class="cat-total-pct">${pct}%</span>
                <span class="cat-total-delta ${diff !== null && diff > 0 ? 'up' : diff !== null && diff < 0 ? 'down' : ''}">${deltaText}</span>
              </div>
            </div>`;
          }).join('')}
        </div>
        <div class="cat-total-total"><span>分类合计 · ${entries.length} 类</span><b>${fmt(total)}</b></div>
        <p class="chart-note">变化按与上期相同的天数比较；「—」表示上期没有同类记录。</p>
      </section>

      <section class="card" style="border-left:2px solid rgba(123,208,255,.55)">
        <div class="card-head" style="margin-bottom:6px"><span class="card-title">这${state.mode === 'week' ? '周' : state.mode === 'month' ? '个月' : '一年'}</span></div>
        <p style="margin:0;font-size:12.5px;line-height:1.75">${top ? `占比最高的是「${escapeAttr(top.cat.name)}」${pcts.get(top.cat.id)}%，共 ${fmt(top.minutes)}；` : ''}共有 ${period.recordedDays} 天有记录，日均 ${fmt(avg)}。</p>
        <p style="margin:5px 0 0;font-size:11.5px;line-height:1.7;color:var(--muted)">分类名和颜色来自设置页的分类目录；改名、停用或新增后，图例、折线、柱状图和总时间会同步更新。</p>
      </section>
    `;

    bindStats(period, entries, activeCat);
  }

  function renderModeRow() {
    return `<div class="mode-row">
      <div class="mode-tabs" role="tablist" aria-label="统计周期">
        ${['week', 'month', 'year'].map((m) => `<button role="tab" data-mode="${m}" aria-selected="${state.mode === m}" tabindex="${state.mode === m ? 0 : -1}">${m === 'week' ? '周' : m === 'month' ? '月' : '年'}</button>`).join('')}
      </div>
      <button class="cat-settings-btn" id="cat-settings">分类设置</button>
    </div>
    <div class="period-bar">
      <div class="period-nav">
        <button class="arrow-btn" id="period-prev" aria-label="上一个周期">‹</button>
        <span class="period-label">${periodFor(state.mode, state.anchor).label}</span>
        <button class="arrow-btn" id="period-next" aria-label="下一个周期" ${canNext(periodFor(state.mode, state.anchor)) ? '' : 'disabled'}>›</button>
      </div>
      <span class="small">${periodFor(state.mode, state.anchor).recordedDays} 天有记录</span>
    </div>`;
  }

  function bindStats(period, entries, activeCat) {
    panel.querySelectorAll('[data-mode]').forEach((btn) => btn.addEventListener('click', () => {
      state.mode = btn.dataset.mode;
      state.selectedBucket = null;
      renderStats();
    }));
    document.getElementById('period-prev')?.addEventListener('click', () => { if (canPrev(period)) shiftAnchor(-1); });
    document.getElementById('period-next')?.addEventListener('click', () => { if (canNext(period)) shiftAnchor(1); });
    document.getElementById('cat-settings')?.addEventListener('click', openEditor);
    panel.querySelectorAll('[data-pick]').forEach((btn) => btn.addEventListener('click', () => {
      state.selectedCat = btn.dataset.pick;
      renderStats();
    }));
    const chart = document.getElementById('trend-chart');
    chart?.querySelectorAll('[data-bucket]').forEach((node) => node.addEventListener('click', () => {
      state.selectedBucket = Number(node.dataset.bucket);
      const detail = document.getElementById('bucket-detail');
      if (detail) detail.innerHTML = bucketDetail(period, activeCat);
      chart.querySelectorAll('[data-bucket]').forEach((n) => n.classList.toggle('active-bucket', Number(n.dataset.bucket) === state.selectedBucket));
    }));
  }

  function donutSvg(entries, total) {
    const pcts = percentMap(entries, total);
    const r = 54, c = 2 * Math.PI * r, size = 158, cx = 79, cy = 79;
    let offset = 0;
    const rings = entries.map((e) => {
      const len = Math.max(0, (e.minutes / total) * c - (entries.length > 1 ? 2.2 : 0));
      const ring = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${colorOf(e.cat)}" stroke-width="17"
        stroke-dasharray="${len} ${c - len}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"><title>${escapeAttr(e.cat.name)} ${fmt(e.minutes)} · ${pcts.get(e.cat.id)}%</title></circle>`;
      offset += (e.minutes / total) * c;
      return ring;
    }).join('');
    return `<svg width="158" height="158" viewBox="0 0 ${size} ${size}" role="img" aria-label="分类占比环形图">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#242b36" stroke-width="17"></circle>
      ${rings}
      <text class="donut-center" x="${cx}" y="${cy - 3}" text-anchor="middle">${fmt(total)}</text>
      <text class="donut-center-sub" x="${cx}" y="${cy + 13}" text-anchor="middle">分类合计</text>
    </svg>`;
  }

  function trendSvg(period, entries, activeCat) {
    const W = 320, H = 172, left = 30, right = 8, top = 18, bottom = 128;
    const plotW = W - left - right;
    const plotH = bottom - top;
    const totals = period.buckets.map((b) => b.cats ? Object.values(b.cats).reduce((a, v) => a + v, 0) : 0);
    const maxTotal = Math.max(1, ...totals);
    const yMax = Math.max(8 * 60, Math.ceil(maxTotal / 120) * 120);
    const yOf = (v) => bottom - (v / yMax) * plotH;
    const n = period.buckets.length;
    const gap = n > 20 ? 1.5 : n > 12 ? 3 : 8;
    const barW = Math.max(3, Math.min(26, plotW / n - gap));
    const xOf = (i) => left + (i + 0.5) * (plotW / n);
    const selectedValues = period.buckets.map((b) => {
      if (!b.cats) return null;
      if (activeCat) return b.cats[activeCat.id] || 0;
      return Object.values(b.cats).reduce((a, v) => a + v, 0);
    });

    let bars = '';
    period.buckets.forEach((bucket, i) => {
      if (!bucket.cats) return;
      let yCursor = bottom;
      for (const cat of catalog) {
        const value = bucket.cats[cat.id] || 0;
        if (!value) continue;
        const h = Math.max(0.7, (value / yMax) * plotH);
        yCursor -= h;
        bars += `<rect x="${xOf(i) - barW / 2}" y="${yCursor}" width="${barW}" height="${h}" rx="1.5" fill="${colorOf(cat)}"><title>${period.buckets[i].label} · ${cat.name} ${fmt(value)}</title></rect>`;
      }
      bars += `<rect x="${xOf(i) - barW / 2 - 1}" y="${top}" width="${barW + 2}" height="${plotH}" fill="transparent" data-bucket="${i}" class="${state.selectedBucket === i ? 'active-bucket' : ''}" style="cursor:pointer"></rect>`;
    });

    const selectedColor = activeCat ? colorOf(activeCat) : '#eef1f6';
    let path = '';
    let pen = false;
    selectedValues.forEach((v, i) => {
      if (v === null) { pen = false; return; }
      const x = xOf(i), y = yOf(v);
      path += `${pen ? 'L' : 'M'}${x.toFixed(1)} ${y.toFixed(1)} `;
      pen = true;
    });
    const dots = selectedValues.map((v, i) => v === null ? '' : `<circle cx="${xOf(i)}" cy="${yOf(v)}" r="2.4" fill="${selectedColor}" stroke="#171b22" stroke-width="1.3"><title>${period.buckets[i].label} · ${activeCat ? activeCat.name : '合计'} ${fmt(v)}</title></circle>`).join('');
    const labels = period.buckets.map((b, i) => {
      const show = period.mode === 'week' || period.mode === 'year' || i === 0 || i === n - 1 || i % 5 === 4;
      return show ? `<text x="${xOf(i)}" y="${bottom + 16}" font-size="8.2" fill="#8b94a5" text-anchor="middle">${b.label}</text>` : '';
    }).join('');
    const lastIdx = selectedValues.map((v, i) => v === null ? -1 : i).filter((i) => i >= 0).pop();
    const lastLabel = lastIdx !== undefined && lastIdx >= 0
      ? `<text x="${Math.min(W - 4, xOf(lastIdx) + 5)}" y="${yOf(selectedValues[lastIdx]) - 7}" font-size="8.4" fill="${selectedColor}" text-anchor="${lastIdx > n * 0.7 ? 'end' : 'start'}" paint-order="stroke" stroke="#171b22" stroke-width="2.4" stroke-linejoin="round">${fmt(selectedValues[lastIdx])}</text>` : '';
    const grid = [0, 0.5, 1].map((f) => `<g><line x1="${left}" y1="${yOf(yMax * f)}" x2="${W - right}" y2="${yOf(yMax * f)}" stroke="#232a35" stroke-width="1"/><text x="0" y="${yOf(yMax * f) + 3}" font-size="8.2" fill="#6f7888">${Math.round(yMax * f / 60)}h</text></g>`).join('');

    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="分类时间柱状图与趋势折线">
      ${grid}${bars}
      <path d="${path}" fill="none" stroke="${selectedColor}" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" opacity=".95"/>
      ${dots}${lastLabel}${labels}
    </svg>`;
  }

  function bucketDetail(period, activeCat) {
    const n = period.buckets.length;
    let idx = state.selectedBucket;
    if (idx === null || idx < 0 || idx >= n || !period.buckets[idx]?.cats) {
      idx = -1;
      for (let i = n - 1; i >= 0; i--) if (period.buckets[i].cats) { idx = i; break; }
    }
    if (idx < 0) return '<span>这个周期还没有记录</span>';
    state.selectedBucket = idx;
    const bucket = period.buckets[idx];
    const total = Object.values(bucket.cats).reduce((a, v) => a + v, 0);
    const top = catalog
      .map((c) => ({ c, v: bucket.cats[c.id] || 0 }))
      .filter((x) => x.v > 0)
      .sort((a, b) => b.v - a.v)
      .slice(0, 3);
    const dateLabel = period.mode === 'year' ? bucket.label : `${bucket.date.getMonth() + 1}/${bucket.date.getDate()}`;
    return `<b>${dateLabel} · ${fmt(total)}</b>${top.map((x) => `<span class="bucket-chip"><i style="background:${colorOf(x.c)}"></i>${escapeAttr(x.c.name)} ${fmtShort(x.v)}</span>`).join('')}${activeCat ? `<span>折线：${escapeAttr(activeCat.name)}</span>` : ''}`;
  }

  /* ---------- 分类设置 ---------- */
  function renderEditor() {
    const list = document.getElementById('editor-list');
    if (!list) return;
    list.innerHTML = catalog.map((c) => `<div class="editor-row ${c.archived ? 'archived' : ''}">
      <i style="background:${colorOf(c)}"></i>
      <input class="editor-input" value="${escapeAttr(c.name)}" data-cat="${c.id}" maxlength="12" aria-label="${escapeAttr(c.name)} 的名称" />
      <button class="archive-btn" data-archive="${c.id}">${c.archived ? '启用' : '停用'}</button>
    </div>`).join('');
    list.querySelectorAll('[data-cat]').forEach((input) => {
      const c = catById(input.dataset.cat);
      if (!c) return;
      input.addEventListener('input', () => {
        c.name = input.value.trim() || c.name;
        renderStats();
      });
      input.addEventListener('blur', () => { if (!input.value.trim()) input.value = c.name; });
    });
    list.querySelectorAll('[data-archive]').forEach((btn) => btn.addEventListener('click', () => {
      const c = catById(btn.dataset.archive);
      if (!c) return;
      c.archived = !c.archived;
      renderEditor();
      renderStats();
    }));
  }
  function escapeAttr(text) {
    return String(text).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  }
  function openEditor() {
    state.editing = true;
    renderEditor();
    document.getElementById('editor-sheet').classList.add('open');
    document.getElementById('new-cat-name').value = '';
  }
  function closeEditor() {
    state.editing = false;
    document.getElementById('editor-sheet').classList.remove('open');
  }
  function addCategory() {
    const input = document.getElementById('new-cat-name');
    const name = input.value.trim();
    if (!name) return;
    const id = `cat-${Date.now().toString(36)}`;
    catalog.push({ id, name, archived: false });
    input.value = '';
    renderEditor();
    renderStats();
  }

  /* ---------- 外层交互 ---------- */
  document.querySelectorAll('[data-tab]').forEach((btn) => btn.addEventListener('click', () => {
    state.tab = btn.dataset.tab;
    document.getElementById('tab-week').setAttribute('aria-selected', String(state.tab === 'week'));
    document.getElementById('tab-days').setAttribute('aria-selected', String(state.tab === 'days'));
    document.getElementById('tab-stats').setAttribute('aria-selected', String(state.tab === 'stats'));
    document.getElementById('tab-week').tabIndex = state.tab === 'week' ? 0 : -1;
    document.getElementById('tab-days').tabIndex = state.tab === 'days' ? 0 : -1;
    document.getElementById('tab-stats').tabIndex = state.tab === 'stats' ? 0 : -1;
    panel.scrollTop = 0;
    renderStats();
  }));
  // 上面的 data-tab 需要按钮本身带属性；补上
  document.getElementById('tab-week').dataset.tab = 'week';
  document.getElementById('tab-days').dataset.tab = 'days';
  document.getElementById('tab-stats').dataset.tab = 'stats';

  document.getElementById('editor-close').addEventListener('click', closeEditor);
  document.getElementById('editor-sheet').addEventListener('click', (e) => { if (e.target.id === 'editor-sheet') closeEditor(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && state.editing) closeEditor(); });
  document.getElementById('add-cat').addEventListener('click', addCategory);
  document.getElementById('new-cat-name').addEventListener('keydown', (e) => { if (e.key === 'Enter') addCategory(); });

  renderStats();
})();
</script>
</body>
</html>
